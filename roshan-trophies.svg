<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1092 168" width="1092" height="168" role="img" aria-label="Roshan profile highlights">
<defs>
<style><![CDATA[
text{font-family:SFMono-Regular,Consolas,Liberation Mono,Menlo,monospace}
@keyframes pop{0%{opacity:0;transform:translateY(16px) scale(.85)}70%{opacity:1;transform:translateY(-3px) scale(1.03)}100%{opacity:1;transform:translateY(0) scale(1)}}
@keyframes glow{0%,100%{opacity:.72}50%{opacity:1}}
.cell{opacity:0;animation:pop .55s cubic-bezier(.2,.8,.3,1.2) forwards;transform-box:fill-box;transform-origin:center}
.g{animation:glow 2.2s ease-in-out infinite}
]]></style>
<linearGradient id="g1" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#ff7eb6"/><stop offset="100%" stop-color="#8b5cf6"/></linearGradient>
</defs>

<g class="cell" style="animation-delay:.2s">
<rect x="12" y="12" width="168" height="144" rx="14" fill="#120b20" stroke="#ff7eb6" stroke-opacity=".55"/>
<text x="96" y="52" text-anchor="middle" font-size="30">🚀</text>
<text class="g" x="96" y="90" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6edf3">Shipped</text>
<text x="96" y="112" text-anchor="middle" font-size="11" fill="#9aa4b2">Keryo · AwaazUthao</text>
</g>

<g class="cell" style="animation-delay:.4s">
<rect x="192" y="12" width="168" height="144" rx="14" fill="#120b20" stroke="#fde047" stroke-opacity=".55"/>
<text x="276" y="52" text-anchor="middle" font-size="30">🧠</text>
<text class="g" x="276" y="90" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6edf3">AI Builder</text>
<text x="276" y="112" text-anchor="middle" font-size="11" fill="#9aa4b2">Keryo · DNA-ai</text>
</g>

<g class="cell" style="animation-delay:.6s">
<rect x="372" y="12" width="168" height="144" rx="14" fill="#120b20" stroke="#e879f9" stroke-opacity=".55"/>
<text x="456" y="52" text-anchor="middle" font-size="30">🎓</text>
<text class="g" x="456" y="90" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6edf3">EdTech</text>
<text x="456" y="112" text-anchor="middle" font-size="11" fill="#9aa4b2">Pariksha-Saathi</text>
</g>

<g class="cell" style="animation-delay:.8s">
<rect x="552" y="12" width="168" height="144" rx="14" fill="#120b20" stroke="#7dd3fc" stroke-opacity=".55"/>
<text x="636" y="52" text-anchor="middle" font-size="30">⚡</text>
<text class="g" x="636" y="90" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6edf3">Ship Fast</text>
<text x="636" y="112" text-anchor="middle" font-size="11" fill="#9aa4b2">Learn · Break · Ship</text>
</g>

<g class="cell" style="animation-delay:1.0s">
<rect x="732" y="12" width="168" height="144" rx="14" fill="#120b20" stroke="#4ade80" stroke-opacity=".55"/>
<text x="816" y="52" text-anchor="middle" font-size="30">🧪</text>
<text class="g" x="816" y="90" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6edf3">Experiment</text>
<text x="816" y="112" text-anchor="middle" font-size="11" fill="#9aa4b2">AI + Web</text>
</g>

<g class="cell" style="animation-delay:1.2s">
<rect x="912" y="12" width="168" height="144" rx="14" fill="#120b20" stroke="#c084fc" stroke-opacity=".55"/>
<text x="996" y="52" text-anchor="middle" font-size="30">🎯</text>
<text class="g" x="996" y="90" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6edf3">Long Term</text>
<text x="996" y="112" text-anchor="middle" font-size="11" fill="#9aa4b2">EdTech / AI company</text>
</g>

<defs>
<linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
<stop offset="0%" stop-color="#fff" stop-opacity="0"/>
<stop offset="50%" stop-color="#fff" stop-opacity=".07"/>
<stop offset="100%" stop-color="#fff" stop-opacity="0"/>
</linearGradient>
</defs>
<rect x="-180" y="0" width="120" height="168" fill="url(#shine)" opacity=".5">
<animate attributeName="x" from="-180" to="1120" dur="5s" begin="2s" repeatCount="indefinite"/>
</rect>
</svg>
