<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 232" width="500" height="232" role="img" aria-label="Roshan's GitHub profile highlights">
<defs>
<style><![CDATA[
text{font-family:SFMono-Regular,Consolas,Liberation Mono,Menlo,monospace}
@keyframes fadeSlide{from{opacity:0;transform:translateX(-14px)}to{opacity:1;transform:translateX(0)}}
@keyframes pulse{0%,100%{opacity:.75}50%{opacity:1}}
@keyframes shine{0%{transform:translateX(-160px) skewX(-15deg)}60%,100%{transform:translateX(560px) skewX(-15deg)}}
.row{opacity:0;animation:fadeSlide .5s ease forwards}
.pulse{animation:pulse 2.4s ease-in-out infinite}
.sh{animation:shine 4.6s ease-in-out 2.2s infinite}
]]></style>
<linearGradient id="tg" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0%" stop-color="#ff7eb6"><animate attributeName="stop-color" values="#ff7eb6;#c084fc;#8b5cf6;#ff7eb6" dur="6s" repeatCount="indefinite"/></stop>
  <stop offset="100%" stop-color="#8b5cf6"><animate attributeName="stop-color" values="#8b5cf6;#7dd3fc;#ff7eb6;#8b5cf6" dur="6s" repeatCount="indefinite"/></stop>
</linearGradient>
<linearGradient id="ring" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#ff7eb6"/><stop offset="100%" stop-color="#8b5cf6"/></linearGradient>
<filter id="g"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>

<rect x="1" y="1" width="498" height="230" rx="14" fill="#120b20" stroke="url(#tg)" stroke-width="1.5"/>
<text x="24" y="38" font-size="16" font-weight="bold" fill="url(#tg)">🧠 Roshan's Build Profile</text>

<g class="row" style="animation-delay:.45s"><text x="24" y="75" font-size="13">🎓</text><text x="52" y="75" font-size="13.2" fill="#c9d1d9">Current focus:</text><text x="316" y="75" text-anchor="end" font-size="13.5" font-weight="bold" fill="#7dd3fc">AI / Tech</text></g>
<g class="row" style="animation-delay:.70s"><text x="24" y="105" font-size="13">🚀</text><text x="52" y="105" font-size="13.2" fill="#c9d1d9">Shipping:</text><text x="316" y="105" text-anchor="end" font-size="13.5" font-weight="bold" fill="#ff7eb6">Real projects</text></g>
<g class="row" style="animation-delay:.95s"><text x="24" y="135" font-size="13">🧩</text><text x="52" y="135" font-size="13.2" fill="#c9d1d9">Core interests:</text><text x="316" y="135" text-anchor="end" font-size="13.5" font-weight="bold" fill="#c084fc">AI + EdTech</text></g>
<g class="row" style="animation-delay:1.20s"><text x="24" y="165" font-size="13">💻</text><text x="52" y="165" font-size="13.2" fill="#c9d1d9">Build style:</text><text x="316" y="165" text-anchor="end" font-size="13.5" font-weight="bold" fill="#4ade80">Vibecoding</text></g>
<g class="row" style="animation-delay:1.45s"><text x="24" y="195" font-size="13">🎯</text><text x="52" y="195" font-size="13.2" fill="#c9d1d9">Long-term:</text><text x="316" y="195" text-anchor="end" font-size="13.5" font-weight="bold" fill="#fde047">EdTech / AI company</text></g>

<g transform="translate(408,138)">
  <circle r="52" fill="none" stroke="#241740" stroke-width="9"/>
  <circle r="52" fill="none" stroke="url(#ring)" stroke-width="9" stroke-linecap="round"
    stroke-dasharray="245 327" stroke-dashoffset="245" transform="rotate(-90)">
    <animate attributeName="stroke-dashoffset" from="245" to="0" dur="1.6s" begin=".6s" fill="freeze"/>
  </circle>
  <text class="pulse" y="13" text-anchor="middle" font-size="37" font-weight="bold" fill="#ff7eb6" filter="url(#g)">R</text>
  <text y="75" text-anchor="middle" font-size="10.5" fill="#8b949e">BUILDING</text>
</g>

<rect class="sh" x="-160" y="1" width="95" height="230" fill="white" opacity=".04"/>
</svg>
