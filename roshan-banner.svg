<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1280 620" width="1280" height="620" role="img" aria-label="Roshan - AI / Tech Builder">
<title>Roshan — AI / Tech Builder</title>
<defs>
<style type="text/css"><![CDATA[
text{font-family:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes popIn{0%{opacity:0;transform:translateY(14px) scale(.85)}70%{opacity:1;transform:translateY(-2px) scale(1.03)}100%{opacity:1;transform:translateY(0) scale(1)}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
@keyframes shineX{0%{transform:translateX(-220px) skewX(-15deg)}60%,100%{transform:translateX(1500px) skewX(-15deg)}}
@keyframes typeLine{from{width:0}to{width:var(--w)}}
@keyframes dotPulse{0%,100%{opacity:.35;transform:scale(1)}50%{opacity:1;transform:scale(1.25)}}
@keyframes gridDrift{from{transform:translateY(0)}to{transform:translateY(40px)}}
.ltr{opacity:0;animation:popIn .5s cubic-bezier(.2,.8,.3,1.2) forwards;transform-box:fill-box;transform-origin:center bottom}
.pill{opacity:0;animation:popIn .5s cubic-bezier(.2,.8,.3,1.2) forwards;transform-box:fill-box;transform-origin:center}
.fl{animation:floaty 4.6s ease-in-out infinite}
.cur{animation:blink 1s step-end infinite}
.sh{animation:shineX 5s ease-in-out 2.6s infinite}
.dot{transform-box:fill-box;transform-origin:center;animation:dotPulse 2s ease-in-out infinite}
.grid{animation:gridDrift 6s linear infinite}
.line{stroke-dasharray:1;opacity:0;animation:fadeIn .4s ease forwards}
]]></style>

<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0%" stop-color="#0a0e14"/><stop offset="55%" stop-color="#0d1117"/><stop offset="100%" stop-color="#0a0e14"/>
</linearGradient>
<linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0%" stop-color="#5b8def"/><stop offset="100%" stop-color="#38bdf8"/>
</linearGradient>
<linearGradient id="termg" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0%" stop-color="#141a23"/><stop offset="100%" stop-color="#0f141b"/>
</linearGradient>
<linearGradient id="shineg" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0%" stop-color="#fff" stop-opacity="0"/><stop offset="50%" stop-color="#fff" stop-opacity=".05"/><stop offset="100%" stop-color="#fff" stop-opacity="0"/>
</linearGradient>
<clipPath id="clip"><rect x="0" y="0" width="1280" height="620" rx="18"/></clipPath>
<clipPath id="termclip"><rect x="0" y="0" width="470" height="330" rx="12"/></clipPath>
</defs>

<g clip-path="url(#clip)">
<rect width="1280" height="620" fill="url(#bg)"/>

<!-- subtle drifting grid -->
<g class="grid" opacity="0.05" stroke="#5b8def" stroke-width="1">
  <path d="M0,60 H1280 M0,140 H1280 M0,220 H1280 M0,300 H1280 M0,380 H1280 M0,460 H1280 M0,540 H1280 M0,620 H1280"/>
  <path d="M100,0 V620 M280,0 V620 M460,0 V620 M640,0 V620 M820,0 V620 M1000,0 V620 M1180,0 V620"/>
</g>

<!-- left content -->
<g transform="translate(80,150)">
  <text class="ltr" style="animation-delay:.1s" x="0" y="0" font-size="22" fill="#8b95a5" letter-spacing="2">HELLO, WORLD</text>

  <text class="ltr" style="animation-delay:.25s" x="0" y="70" font-size="58" font-weight="700" fill="#e6edf3">I'm Roshan<tspan class="cur" fill="url(#accent)">_</tspan></text>

  <text class="ltr" style="animation-delay:.4s" x="0" y="120" font-size="26" fill="#9aa5b5">Class 10 Student · Building in AI &amp; Tech</text>

  <!-- accent underline -->
  <rect class="ltr" style="animation-delay:.55s" x="0" y="140" width="220" height="4" rx="2" fill="url(#accent)"/>

  <!-- pills -->
  <g transform="translate(0,185)">
    <g class="pill fl" style="animation-delay:.7s">
      <rect width="88" height="34" rx="17" fill="#131a24" stroke="#5b8def" stroke-opacity=".5"/>
      <text x="44" y="22" text-anchor="middle" font-size="14" fill="#5b8def">AI/ML</text>
    </g>
    <g class="pill fl" style="animation-delay:.82s" transform="translate(98,0)">
      <rect width="100" height="34" rx="17" fill="#131a24" stroke="#38bdf8" stroke-opacity=".5"/>
      <text x="50" y="22" text-anchor="middle" font-size="14" fill="#38bdf8">Web Dev</text>
    </g>
    <g class="pill fl" style="animation-delay:.94s" transform="translate(208,0)">
      <rect width="94" height="34" rx="17" fill="#131a24" stroke="#5b8def" stroke-opacity=".5"/>
      <text x="47" y="22" text-anchor="middle" font-size="14" fill="#5b8def">EdTech</text>
    </g>
    <g class="pill fl" style="animation-delay:1.06s" transform="translate(0,46)">
      <rect width="110" height="34" rx="17" fill="#131a24" stroke="#38bdf8" stroke-opacity=".5"/>
      <text x="55" y="22" text-anchor="middle" font-size="14" fill="#38bdf8">Python</text>
    </g>
    <g class="pill fl" style="animation-delay:1.18s" transform="translate(120,46)">
      <rect width="128" height="34" rx="17" fill="#131a24" stroke="#5b8def" stroke-opacity=".5"/>
      <text x="64" y="22" text-anchor="middle" font-size="14" fill="#5b8def">JavaScript</text>
    </g>
  </g>

  <text class="ltr" style="animation-delay:1.4s" x="0" y="290" font-size="16" fill="#6b7585" font-style="italic">"Learning by shipping, not just reading."</text>
</g>

<!-- right terminal card -->
<g transform="translate(700,140)" class="fl" style="animation-duration:6s">
  <rect width="470" height="330" rx="12" fill="url(#termg)" stroke="#232b36"/>
  <g clip-path="url(#termclip)">
    <rect width="470" height="34" fill="#171d27"/>
    <circle cx="20" cy="17" r="6" fill="#ff5f57"/>
    <circle cx="42" cy="17" r="6" fill="#febc2e"/>
    <circle cx="64" cy="17" r="6" fill="#28c840"/>
    <text x="235" y="22" text-anchor="middle" font-size="13" fill="#6b7585">roshan@dev: ~</text>

    <g font-size="15" fill="#9aa5b5">
      <text class="ltr" style="animation-delay:1s" x="22" y="70"><tspan fill="#5b8def">$</tspan> whoami</text>
      <text class="ltr" style="animation-delay:1.25s" x="22" y="100" fill="#e6edf3">roshan — future EdTech/AI founder</text>
      <text class="ltr" style="animation-delay:1.5s" x="22" y="140"><tspan fill="#5b8def">$</tspan> cat goals.txt</text>
      <text class="ltr" style="animation-delay:1.75s" x="22" y="168">→ build DNA-ai</text>
      <text class="ltr" style="animation-delay:1.9s" x="22" y="192">→ ship Pariksha-Saathi</text>
      <text class="ltr" style="animation-delay:2.05s" x="22" y="216">→ never stop learning</text>
      <text class="ltr" style="animation-delay:2.3s" x="22" y="256"><tspan fill="#5b8def">$</tspan> status<tspan class="cur" fill="#38bdf8">_</tspan></text>
    </g>
  </g>
  <rect width="470" height="330" rx="12" fill="none" stroke="url(#accent)" stroke-opacity=".35"/>
</g>

<!-- decorative pulse dots -->
<circle class="dot" cx="640" cy="90" r="4" fill="#5b8def" style="animation-delay:.3s"/>
<circle class="dot" cx="1210" cy="500" r="4" fill="#38bdf8" style="animation-delay:.9s"/>
<circle class="dot" cx="60" cy="500" r="3" fill="#5b8def" style="animation-delay:1.4s"/>

<!-- bottom shine sweep -->
<rect x="0" y="0" width="1280" height="620" fill="url(#shineg)" class="sh"/>
<rect x="0" y="612" width="1280" height="8" fill="url(#accent)" opacity=".6"/>
</g>
</svg>
