<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" role="img" aria-label="Roshan — Building in AI and Tech">
<defs>
  <style><![CDATA[
    text{font-family:Inter,Segoe UI,Arial,sans-serif}
    .mono{font-family:SFMono-Regular,Consolas,Liberation Mono,Menlo,monospace}
    @keyframes drift{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
    @keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}
    @keyframes twinkle{0%,100%{opacity:.1;transform:scale(.6)}50%{opacity:1;transform:scale(1)}}
    @keyframes scan{0%{transform:translateX(-120px)}60%,100%{transform:translateX(1280px)}}
    .drift{animation:drift 6s ease-in-out infinite}
    .pulse{animation:pulse 2.8s ease-in-out infinite}
    .tw{animation:twinkle 3.1s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
    .scan{animation:scan 6s ease-in-out 1s infinite}
  ]]></style>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#120b20"/>
    <stop offset="55%" stop-color="#170e28"/>
    <stop offset="100%" stop-color="#0d1117"/>
  </linearGradient>
  <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#ff7eb6"><animate attributeName="stop-color" values="#ff7eb6;#c084fc;#8b5cf6;#ff7eb6" dur="7s" repeatCount="indefinite"/></stop>
    <stop offset="55%" stop-color="#e879f9"><animate attributeName="stop-color" values="#e879f9;#ff7eb6;#c084fc;#e879f9" dur="7s" repeatCount="indefinite"/></stop>
    <stop offset="100%" stop-color="#8b5cf6"><animate attributeName="stop-color" values="#8b5cf6;#7dd3fc;#ff7eb6;#8b5cf6" dur="7s" repeatCount="indefinite"/></stop>
  </linearGradient>
  <radialGradient id="glowP"><stop offset="0%" stop-color="#ff7eb6" stop-opacity=".14"/><stop offset="100%" stop-color="#ff7eb6" stop-opacity="0"/></radialGradient>
  <radialGradient id="glowV"><stop offset="0%" stop-color="#8b5cf6" stop-opacity=".16"/><stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/></radialGradient>
  <filter id="blur"><feGaussianBlur stdDeviation="20"/></filter>
  <filter id="shadow"><feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#000" flood-opacity=".45"/></filter>
  <clipPath id="clip"><rect x="16" y="16" width="1168" height="288" rx="24"/></clipPath>
</defs>

<rect x="16" y="16" width="1168" height="288" rx="24" fill="url(#bg)" stroke="url(#neon)" stroke-opacity=".75" stroke-width="2" filter="url(#shadow)"/>
<g clip-path="url(#clip)">
  <circle cx="150" cy="70" r="170" fill="url(#glowP)" filter="url(#blur)"/>
  <circle cx="1060" cy="270" r="210" fill="url(#glowV)" filter="url(#blur)"/>

  <path d="M16 240 C220 180, 300 280, 470 220 S780 120, 1184 195" fill="none" stroke="#8b5cf6" stroke-opacity=".14" stroke-width="2"/>
  <path d="M16 255 C220 195, 300 295, 470 235 S780 135, 1184 210" fill="none" stroke="#ff7eb6" stroke-opacity=".10" stroke-width="1"/>

  <g class="tw" style="animation-delay:.2s"><circle cx="92" cy="66" r="2.5" fill="#ff7eb6"/></g>
  <g class="tw" style="animation-delay:1.1s"><circle cx="1015" cy="70" r="3" fill="#c084fc"/></g>
  <g class="tw" style="animation-delay:2s"><circle cx="1085" cy="126" r="2" fill="#7dd3fc"/></g>
  <g class="tw" style="animation-delay:.8s"><circle cx="870" cy="82" r="2.5" fill="#ff7eb6"/></g>
  <g class="tw" style="animation-delay:1.8s"><circle cx="260" cy="118" r="2" fill="#c084fc"/></g>

  <g class="drift">
    <rect x="84" y="52" width="260" height="166" rx="12" fill="#0d1117" stroke="#334155"/>
    <circle cx="100" cy="68" r="5" fill="#ff5f56"/>
    <circle cx="116" cy="68" r="5" fill="#ffbd2e"/>
    <circle cx="132" cy="68" r="5" fill="#27c93f"/>
    <text x="102" y="102" class="mono" font-size="13" fill="#8b949e">$ whoami</text>
    <text x="102" y="128" class="mono" font-size="13" fill="#e6edf3">roshan — builder</text>
    <text x="102" y="154" class="mono" font-size="12" fill="#7dd3fc">→ AI / Tech</text>
    <text x="102" y="178" class="mono" font-size="12" fill="#c084fc">→ EdTech / AI</text>
    <text x="102" y="202" class="mono" font-size="12" fill="#ff7eb6">→ shipping projects</text>
  </g>

  <g transform="translate(380 78)">
    <text x="0" y="20" class="mono" font-size="12" fill="#8b949e" letter-spacing="3">CLASS 10 · BUILDING IN AI / TECH</text>
    <text x="0" y="84" font-size="62" font-weight="800" fill="url(#neon)">Roshan</text>
    <text x="4" y="120" font-size="22" fill="#e6edf3">AI / EdTech Builder</text>
    <text x="4" y="152" font-size="15" fill="#9aa4b2">Learn by building. Break things. Ship anyway.</text>

    <g transform="translate(0 186)">
      <rect x="0" y="0" width="120" height="32" rx="16" fill="#120b20" stroke="#8b5cf6"/>
      <text x="60" y="21" text-anchor="middle" font-size="12" class="mono" fill="#c084fc">JavaScript</text>
      <rect x="132" y="0" width="120" height="32" rx="16" fill="#120b20" stroke="#ff7eb6"/>
      <text x="192" y="21" text-anchor="middle" font-size="12" class="mono" fill="#ff7eb6">TypeScript</text>
      <rect x="264" y="0" width="88" height="32" rx="16" fill="#120b20" stroke="#7dd3fc"/>
      <text x="308" y="21" text-anchor="middle" font-size="12" class="mono" fill="#7dd3fc">AI</text>
      <rect x="364" y="0" width="96" height="32" rx="16" fill="#120b20" stroke="#e879f9"/>
      <text x="412" y="21" text-anchor="middle" font-size="12" class="mono" fill="#e879f9">EdTech</text>
    </g>
  </g>

  <rect class="scan" x="0" y="28" width="90" height="262" fill="url(#neon)" opacity=".06" filter="url(#blur)"/>
</g>
</svg>
