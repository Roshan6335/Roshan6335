<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 282" width="420" height="282" role="img" aria-label="Roshan's technology focus">
<defs>
<style><![CDATA[
text{font-family:SFMono-Regular,Consolas,Liberation Mono,Menlo,monospace}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes grow{from{width:0}to{width:var(--w)}}
@keyframes shine{0%{transform:translateX(-140px)}60%,100%{transform:translateX(460px)}}
.row{opacity:0;animation:fadeUp .5s ease forwards}
.sh{animation:shine 4s ease-in-out 2.2s infinite}
]]></style>
<linearGradient id="tg" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0%" stop-color="#ff7eb6"><animate attributeName="stop-color" values="#ff7eb6;#c084fc;#8b5cf6;#ff7eb6" dur="6s" repeatCount="indefinite"/></stop>
  <stop offset="100%" stop-color="#8b5cf6"><animate attributeName="stop-color" values="#8b5cf6;#7dd3fc;#ff7eb6;#8b5cf6" dur="6s" repeatCount="indefinite"/></stop>
</linearGradient>
<clipPath id="sc"><rect x="20" y="58" width="380" height="11" rx="5.5"/></clipPath>
</defs>
<rect x="1" y="1" width="418" height="280" rx="14" fill="#120b20" stroke="url(#tg)" stroke-width="1.5"/>
<text x="20" y="34" font-size="16" font-weight="bold" fill="url(#tg)">📊 Tech Stack &amp; Focus</text>

<g clip-path="url(#sc)">
  <rect x="20" y="58" width="130" height="11" fill="#f1e05a"/>
  <rect x="150" y="58" width="105" height="11" fill="#3178c6"/>
  <rect x="255" y="58" width="75" height="11" fill="#a855f7"/>
  <rect x="330" y="58" width="45" height="11" fill="#22c55e"/>
  <rect x="375" y="58" width="25" height="11" fill="#f97316"/>
</g>

<g class="row" style="animation-delay:.65s">
  <circle cx="26" cy="92" r="5" fill="#f1e05a"/><text x="40" y="96" font-size="13" fill="#e6edf3" font-weight="bold">JavaScript</text>
  <text x="396" y="96" text-anchor="end" font-size="13" fill="#f1e05a" font-weight="bold">Core</text>
  <rect x="40" y="104" width="268" height="9" rx="4.5" fill="#241740"/><rect x="40" y="104" width="190" height="9" rx="4.5" fill="#f1e05a"><animate attributeName="width" from="0" to="190" dur="1.1s" begin=".8s" fill="freeze"/></rect>
</g>

<g class="row" style="animation-delay:.95s">
  <circle cx="26" cy="134" r="5" fill="#3178c6"/><text x="40" y="138" font-size="13" fill="#e6edf3" font-weight="bold">TypeScript</text>
  <text x="396" y="138" text-anchor="end" font-size="13" fill="#7db8ff" font-weight="bold">Active</text>
  <rect x="40" y="146" width="268" height="9" rx="4.5" fill="#241740"/><rect x="40" y="146" width="156" height="9" rx="4.5" fill="#3178c6"><animate attributeName="width" from="0" to="156" dur="1.1s" begin="1.1s" fill="freeze"/></rect>
</g>

<g class="row" style="animation-delay:1.25s">
  <circle cx="26" cy="176" r="5" fill="#a855f7"/><text x="40" y="180" font-size="13" fill="#e6edf3" font-weight="bold">AI / ML</text>
  <text x="396" y="180" text-anchor="end" font-size="13" fill="#c084fc" font-weight="bold">Focus</text>
  <rect x="40" y="188" width="268" height="9" rx="4.5" fill="#241740"/><rect x="40" y="188" width="112" height="9" rx="4.5" fill="#a855f7"><animate attributeName="width" from="0" to="112" dur="1.1s" begin="1.4s" fill="freeze"/></rect>
</g>

<g class="row" style="animation-delay:1.55s">
  <circle cx="26" cy="218" r="5" fill="#22c55e"/><text x="40" y="222" font-size="13" fill="#e6edf3" font-weight="bold">EdTech</text>
  <text x="396" y="222" text-anchor="end" font-size="13" fill="#4ade80" font-weight="bold">Mission</text>
  <rect x="40" y="230" width="268" height="9" rx="4.5" fill="#241740"/><rect x="40" y="230" width="88" height="9" rx="4.5" fill="#22c55e"><animate attributeName="width" from="0" to="88" dur="1.1s" begin="1.7s" fill="freeze"/></rect>
</g>

<rect class="sh" x="-140" y="1" width="90" height="280" fill="white" opacity=".04"/>
</svg>
